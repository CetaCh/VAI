<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI 视频生成器 · 高性能版</title>
<style>
:root{color-scheme:light;--p:#2258c3;--op:#fff;--pc:#d6e3ff;--opc:#001a41;--sc:#dfe2f8;
--s:#f8faff;--os:#1a1b20;--sv:#e0e2ea;--osv:#44464f;--o:#757780;--err:#b3261e;--errc:#f9dedc;
--ok:#2e7d32;--okc:#e8f5e9;--warn:#e65100;--glass:rgba(248,250,255,.75);--gsv:rgba(224,226,234,.65);
--gout:rgba(117,119,128,.45);--code:#1e1e1e;--codef:#d4d4d4;--navh:64px;
--spring:cubic-bezier(.34,1.56,.64,1);--expo:cubic-bezier(.16,1,.3,1);}
[data-theme="dark"]{color-scheme:dark;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--s);height:100dvh;overflow:hidden;}
body{background:var(--s);color:var(--os);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
input,textarea,select,button{font-family:inherit;}
.ci,.cs,.ct{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--o);background:var(--s);
color:var(--os);font-size:14px;transition:border-color .2s,box-shadow .2s;min-width:0;}
.ci:focus,.cs:focus,.ct:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pc);outline:none;}
.ct{resize:vertical;min-height:80px;}
.cs{appearance:none;background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cpath fill='%23757780' d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
background-repeat:no-repeat;background-position:right 12px center;padding-right:40px;}
.ps{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;padding-bottom:140px;-webkit-overflow-scrolling:touch;}
.nav,.card,.head,.status,.tcard,.bcard{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);
-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--gout);}
body.rendering *{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;
animation:none !important;transition:none !important;box-shadow:none !important;}
body.rendering .nav,body.rendering .card,body.rendering .head,body.rendering .status{background:var(--s) !important;}
.nav{position:fixed;bottom:0;left:0;width:100%;height:calc(var(--navh) + env(safe-area-inset-bottom));
background:var(--gsv) !important;border-radius:24px 24px 0 0;border-bottom:none;display:flex;justify-content:center;
align-items:center;gap:24px;padding-bottom:env(safe-area-inset-bottom);z-index:9999;box-shadow:0 -4px 24px rgba(0,0,0,.08);}
.nitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 20px;border-radius:16px;
color:var(--osv);font-size:12px;font-weight:500;background:none;border:none;cursor:pointer;}
.nitem.active{color:var(--opc);background:var(--pc);}
.page{display:none;}.page.active{display:block;animation:fadeIn .4s var(--expo);}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;margin-bottom:16px;}
.head h1{font-size:20px;font-weight:600;}.head .sp{flex:1;}
.tbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--osv);background:none;border:none;cursor:pointer;}
.dots{display:flex;gap:6px;align-items:center;background:var(--sv);padding:4px 8px;border-radius:20px;}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.dot.active{border-color:var(--os);box-shadow:0 0 0 4px var(--pc);}
.card{border-radius:20px;padding:20px;margin-bottom:16px;}
.ctitle{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.fg{margin-bottom:18px;}
.fl{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--osv);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.chip{padding:6px 14px;border-radius:16px;border:1px solid var(--o);font-size:13px;background:none;color:var(--os);cursor:pointer;}
.chip.active{background:var(--pc);border-color:var(--p);color:var(--opc);font-weight:600;}
.styles{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:16px;}
.schip{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;
border:2px solid var(--o);background:var(--s);font-size:11px;font-weight:500;color:var(--osv);cursor:pointer;}
.schip.active{border-color:var(--p);background:var(--pc);color:var(--opc);font-weight:600;}
.btn{flex:1;min-width:110px;padding:12px 20px;border-radius:20px;font-size:14px;font-weight:600;
display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:1px solid transparent;}
.bf{background:var(--p);color:var(--op);}.bo{background:none;color:var(--p);border-color:var(--o);}
.bf:disabled,.bo:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.task-empty{text-align:center;color:var(--osv);font-size:13px;padding:32px 16px;border:1px dashed var(--o);border-radius:16px;}
.tcard{display:flex;gap:12px;padding:12px;border-radius:16px;margin-bottom:12px;}
.tcover{width:120px;height:68px;border-radius:10px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,#3a1c71,#d76d77);}
.tbody{flex:1;min-width:0;}
.ttitle{font-weight:600;font-size:15px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tstatus{font-size:12px;color:var(--osv);margin-bottom:8px;}
.tbar{height:4px;border-radius:2px;background:var(--sv);overflow:hidden;margin-bottom:8px;}
.tfill{height:100%;background:var(--p);transition:width .2s;width:0;}
.status{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;font-weight:500;}
.status.loading{background:var(--pc);color:var(--opc);}
.status.success{background:var(--okc);color:var(--ok);}
.status.error{background:var(--errc);color:var(--err);}
.sdot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;}
.bcard{border-radius:20px;padding:24px;margin-bottom:16px;background:linear-gradient(135deg,var(--p),var(--pc));color:var(--op);}
.bcard .amt{font-size:36px;font-weight:700;}
.brow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--sv);font-size:14px;}
.brow:last-child{border-bottom:none;}
.log{background:var(--code);color:var(--codef);border-radius:12px;padding:12px;font-family:ui-monospace,monospace;
font-size:12px;line-height:1.6;max-height:200px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}
.toast{position:fixed;bottom:calc(var(--navh) + 40px);left:50%;transform:translateX(-50%) translateY(20px);
opacity:0;background:#323232;color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:99999;
transition:all .35s var(--expo);pointer-events:none;max-width:90vw;}
.toast.show{opacity:1;transform:translateX(-50%);}
.hint{font-size:12px;color:var(--osv);margin-top:4px;line-height:1.5;}
.pv{width:100%;aspect-ratio:16/9;background:#0d0d0d;border-radius:16px;overflow:hidden;margin-bottom:14px;border:1px solid var(--o);}
@media(min-width:768px){.ps{padding:24px;}}
</style>
</head>
<body>
<div class="ps" id="scroll">
  <div class="page active" id="page-generator">
    <div class="head">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="var(--p)"><path d="M12 3.2l1.7 5.1 5.1 1.7-5.1 1.7-1.7 5.1-1.7-5.1L5.2 10l5.1-1.7z"/></svg>
      <h1>视频生成器</h1><span class="sp"></span>
      <div class="dots" id="dots"></div>
    </div>
    <div class="status" id="statusBar"><span class="sdot"></span><span id="statusText">就绪</span></div>

    <div class="card">
      <div class="ctitle">API 配置</div>
      <div class="fg"><label class="fl">API Key</label>
        <input id="apiKeyInput" type="password" class="ci" placeholder="sk-xxxxxxxxxxxxxxxx"></div>
      <div class="fg"><label class="fl">API 端点</label>
        <input id="endpointInput" type="text" class="ci" value="https://api.deepseek.com/chat/completions"></div>
      <div class="fg"><label class="fl">Max Tokens（输出上限）</label>
        <input id="maxTokensInput" type="number" class="ci" value="32768">
        <div class="hint">范围 4096–131072。系统按预估字数动态绘制进度。</div></div>
      <button class="btn bo" id="dlApkBtn" style="width:100%">下载安卓安装包</button>
    </div>

    <div class="card">
      <div class="ctitle">生成设置</div>
      <div class="fg"><label class="fl">模型</label>
        <select id="modelSelect" class="cs">
          <option value="deepseek-chat">deepseek-chat（V4 Flash）</option>
          <option value="deepseek-reasoner">deepseek-reasoner（V4 Pro 深度思考）</option>
        </select></div>
      <div class="fg"><label class="fl">响应字段</label>
        <select id="fieldModeSelect" class="cs">
          <option value="auto">自动（优先 content，为空回退 reasoning_content）</option>
          <option value="content">仅使用 content</option>
          <option value="reasoning">仅使用 reasoning_content</option>
        </select></div>
      <div class="fg"><label class="fl">生成风格</label>
        <div class="styles" id="styleSelector">
          <button class="schip active" data-style="vibe">Vibe</button>
          <button class="schip" data-style="macos">macOS</button>
          <button class="schip" data-style="material">Material</button>
          <button class="schip" data-style="free">自由</button>
          <button class="schip" data-style="claude">Claude</button>
        </div></div>
      <div class="fg"><label class="fl">创意提示词</label>
        <textarea id="promptInput" class="ct" rows="3" placeholder="描述你想要的视频内容..."></textarea></div>
      <button class="btn bf" id="generateBtn" style="width:100%">加入生成队列</button>
    </div>

    <div class="card">
      <div class="ctitle">渲染参数</div>
      <div class="fg"><label class="fl">视频时长（秒）— 5 ~ 1200</label>
        <input id="durationInput" type="number" class="ci" value="8" min="5" max="1200">
        <div class="hint" id="durationHint">建议 5–30 秒</div>
        <div class="chips" id="durationPresets" style="margin-top:8px">
          <button class="chip" data-dur="5">5s</button><button class="chip active" data-dur="8">8s</button>
          <button class="chip" data-dur="15">15s</button><button class="chip" data-dur="30">30s</button>
          <button class="chip" data-dur="60">60s</button><button class="chip" data-dur="120">120s</button>
          <button class="chip" data-dur="300">300s</button></div></div>
      <div class="fg"><label class="fl">帧率</label>
        <div class="chips" id="fpsPresets">
          <button class="chip" data-fps="24">24</button><button class="chip active" data-fps="30">30</button>
          <button class="chip" data-fps="60">60</button><button class="chip" data-fps="120">120</button>
          <button class="chip" data-fps="240">240</button></div>
        <div class="hint" id="fpsHint"></div></div>
      <div class="fg"><label class="fl">分辨率</label>
        <select id="resolutionSelect" class="cs">
          <option value="360p">360P</option><option value="720p">720P</option>
          <option value="1080p" selected>1080P</option><option value="4k">4K（注意性能）</option>
        </select></div>
    </div>

    <div class="card">
      <div class="ctitle"><span style="flex:1">任务列表</span>
        <button id="clearTasksBtn" style="color:var(--err);font-size:12px;font-weight:600;background:none;border:none;cursor:pointer">清空全部</button></div>
      <div id="taskList"></div>
    </div>

    <div class="card">
      <div class="ctitle">运行日志</div>
      <div class="log" id="logArea"></div>
    </div>
  </div>

  <div class="page" id="page-preview">
    <div class="head"><h1>预览与导出</h1><span class="sp"></span></div>
    <div id="previewPageContent">
      <div class="card"><div style="text-align:center;padding:20px;color:var(--osv)">请从任务列表选择一个已完成的任务进行预览</div></div>
    </div>
  </div>

  <div class="page" id="page-wallet">
    <div class="head"><h1>钱包</h1><span class="sp"></span></div>
    <div class="bcard"><div style="font-size:13px;opacity:.85">账户总余额</div>
      <div class="amt" id="walletTotal">-- <span style="font-size:16px">CNY</span></div>
      <div id="walletStatus" style="font-size:12px;opacity:.8;margin-top:8px">点击下方按钮查询</div></div>
    <div class="card"><div class="ctitle">余额明细</div>
      <div class="brow"><span style="color:var(--osv)">充值余额</span><span id="walletToppedUp">--</span></div>
      <div class="brow"><span style="color:var(--osv)">赠金余额</span><span id="walletGranted">--</span></div>
      <div class="brow"><span style="color:var(--osv)">可用状态</span><span id="walletAvailable">--</span></div>
      <div class="brow"><span style="color:var(--osv)">币种</span><span id="walletCurrency">--</span></div></div>
    <div class="card"><div class="ctitle">查询记录</div><div class="log" id="walletLog" style="max-height:150px"></div></div>
    <div class="row"><button id="queryBalanceBtn" class="btn bf">查询余额</button>
      <button id="clearWalletLogBtn" class="btn bo">清空记录</button></div>
  </div>
</div>

<nav class="nav">
  <button class="nitem active" data-page="generator">生成器</button>
  <button class="nitem" data-page="preview">预览器</button>
  <button class="nitem" data-page="wallet">钱包</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* 轻量演示壳：与安卓 App 共用同一套数据与接口，网页端仅做交互示意 */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function toast(m) { var t = $('toast'); if (!t) return; t.textContent = m; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function log(m) { var a = $('logArea'); if (!a) return;
    a.innerHTML += '<div>' + esc(m) + '</div>'; a.scrollTop = a.scrollHeight; }

  // 主题
  var COLORS = ['#2258c3', '#6750a4', '#0061a4', '#006e1c', '#8b5000', '#984061'];
  function applyTheme(hex) {
    document.documentElement.style.setProperty('--p', hex);
  }
  $('dots').innerHTML = COLORS.map(function (c, i) {
    return '<div class="dot' + (i === 0 ? ' active' : '') + '" style="background:' + c + '" data-c="' + c + '"></div>';
  }).join('');
  $('dots').addEventListener('click', function (e) {
    var d = e.target.closest('.dot'); if (!d) return;
    Array.prototype.forEach.call($('dots').children, function (x) { x.classList.remove('active'); });
    d.classList.add('active'); applyTheme(d.dataset.c);
  });

  // 页面切换
  document.querySelector('.nav').addEventListener('click', function (e) {
    var b = e.target.closest('.nitem'); if (!b) return;
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function (p) {
      p.classList.toggle('active', p.id === 'page-' + b.dataset.page); });
    Array.prototype.forEach.call(document.querySelectorAll('.nitem'), function (x) {
      x.classList.toggle('active', x === b); });
  });

  // 预设 chip
  ['durationPresets', 'fpsPresets'].forEach(function (id) {
    $(id).addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      Array.prototype.forEach.call($(id).children, function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      if (id === 'durationPresets') $('durationInput').value = b.dataset.dur;
      updateHint();
    });
  });
  function updateHint() {
    var d = parseInt($('durationInput').value, 10) || 8;
    var f = parseInt((document.querySelector('#fpsPresets .chip.active') || {}).dataset ? document.querySelector('#fpsPresets .chip.active').dataset.fps : 30, 10) || 30;
    $('fpsHint').textContent = '预计 ' + (d * f).toLocaleString() + ' 帧';
  }
  $('durationInput').addEventListener('input', updateHint);
  updateHint();

  // 风格
  $('styleSelector').addEventListener('click', function (e) {
    var b = e.target.closest('.schip'); if (!b) return;
    Array.prototype.forEach.call($('styleSelector').children, function (x) { x.classList.remove('active'); });
    b.classList.add('active');
  });

  $('generateBtn').addEventListener('click', function () {
    if (!$('promptInput').value.trim()) { toast('请填写创意提示词'); return; }
    if (!$('apiKeyInput').value.trim()) { toast('请填写 API Key'); return; }
    toast('网页版为演示界面，完整生成请使用安卓客户端');
  });
  $('dlApkBtn').addEventListener('click', function () {
    if (window.VaiApk) window.VaiApk.open();
  });
  $('clearTasksBtn').addEventListener('click', function () {
    $('taskList').innerHTML = '';
    toast('已清空');
  });
  log('网页演示壳已就绪');
})();
</script>
<!-- 安卓安装包入口：读取同目录 version.txt，安卓设备自动提示 -->
<script src="vai-apk.js" data-offset="calc(var(--navh) + env(safe-area-inset-bottom) + 12px)"></script>
</body>
</html>
