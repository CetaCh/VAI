<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>文档</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">

<style>
/* ================= 变量 ================= */
:root {
  --bg: #080b12;
  --surface: #0e131d;
  --surface-2: #151b28;
  --surface-3: #1b2333;
  --border: #212a3a;
  --border-soft: #171e2b;
  --text: #e4e9f3;
  --text-dim: #8d99b0;
  --text-mute: #66718a;
  --primary: #6b9bff;
  --primary-dim: #16294d;
  --primary-soft: rgba(107, 155, 255, .1);
  --code-bg: #0b0f16;
  --sidebar-w: 292px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  font-size: 15px;
  line-height: 1.65;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(900px 600px at 12% -10%, rgba(107, 155, 255, .07), transparent 70%),
    radial-gradient(700px 500px at 100% 110%, rgba(107, 155, 255, .05), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3446; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #3a4761; }

/* ================= 侧边栏 ================= */
.sidebar {
  position: relative;
  z-index: 60;
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: linear-gradient(180deg, #0d121b 0%, #080c13 100%);
}

.brand {
  padding: 22px 20px 16px;
  border-bottom: 1px solid var(--border-soft);
  flex-shrink: 0;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -.2px;
}
.brand-title .material-icons-outlined {
  font-size: 20px;
  color: var(--primary);
}
.brand-sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 5px;
  padding-left: 29px;
}
.brand-ver {
  display: inline-block;
  margin-top: 11px;
  margin-left: 29px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 20px;
  background: var(--primary-dim);
  color: #a9c4ff;
}

.toc {
  flex: 1;
  overflow-y: auto;
  padding: 14px 12px 48px;
  scrollbar-width: thin;
}
.toc::-webkit-scrollbar { width: 6px; }

.toc-group { margin-bottom: 6px; }

.toc-item {
  display: block;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-dim);
  cursor: pointer;
  text-decoration: none;
  transition: background .2s, color .2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-item:hover { background: rgba(255, 255, 255, .04); color: var(--text); }
.toc-item.active {
  background: var(--primary-dim);
  color: #cfe0ff;
}

.toc-sub {
  display: block;
  padding: 5px 12px 5px 26px;
  margin-left: 10px;
  border-left: 1px solid var(--border);
  font-size: 12.5px;
  color: var(--text-mute);
  cursor: pointer;
  text-decoration: none;
  transition: color .2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toc-sub:hover { color: var(--text-dim); }
.toc-sub.active { color: var(--primary); border-left-color: var(--primary); }

/* ================= 主区 ================= */
.main {
  position: relative;
  z-index: 10;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.topbar {
  flex: 0 0 58px;
  height: 58px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: rgba(8, 11, 18, .85);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.icon-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: background .2s, color .2s;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .material-icons-outlined { font-size: 20px; }

.segmented {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 10px;
  background: var(--surface-2);
}
.seg {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 15px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-dim);
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .2s, color .2s;
}
.seg .material-icons-outlined { font-size: 16px; }
.seg:hover { color: var(--text); }
.seg.active { background: var(--primary-dim); color: #cfe0ff; }

.topbar-spacer { flex: 1; }

.topbar-meta {
  font-size: 12px;
  color: var(--text-mute);
  white-space: nowrap;
}

/* ================= 滚动区 ================= */
.scroller {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  padding: 40px 48px 160px;
}

.view { display: none; }
.view.active { display: block; }

.content {
  max-width: 820px;
  margin: 0 auto;
}

/* ================= Markdown ================= */
.doc-section { margin-bottom: 72px; }
.doc-section:last-child { margin-bottom: 0; }

.doc-title {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -.6px;
  line-height: 1.3;
  padding-bottom: 16px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border-soft);
}

.md-body h2 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.2px;
  margin: 40px 0 14px;
  scroll-margin-top: 24px;
}
.md-body h2:first-child { margin-top: 0; }

.md-body h3 {
  font-size: 16px;
  font-weight: 600;
  color: var(--primary);
  margin: 26px 0 10px;
}

.md-body h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  margin: 20px 0 8px;
}

.md-body p { margin: 12px 0; color: #cfd7e6; }

.md-body ul, .md-body ol { padding-left: 24px; margin: 12px 0; }
.md-body li { margin: 6px 0; color: #cfd7e6; }
.md-body li::marker { color: var(--text-mute); }

.md-body a {
  color: var(--primary);
  text-decoration: none;
  border-bottom: 1px solid rgba(107, 155, 255, .3);
  transition: border-color .2s;
}
.md-body a:hover { border-bottom-color: var(--primary); }

.md-body strong { color: #fff; font-weight: 600; }

.md-body code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .87em;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--surface-2);
  color: #9ecbff;
  border: 1px solid var(--border-soft);
}

.md-body pre {
  position: relative;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin: 18px 0;
  overflow-x: auto;
}
.md-body pre code {
  background: none;
  border: none;
  padding: 0;
  color: #c9d6ea;
  font-size: 13px;
  line-height: 1.7;
}

.md-body blockquote {
  margin: 18px 0;
  padding: 12px 18px;
  border-left: 3px solid var(--primary);
  border-radius: 0 10px 10px 0;
  background: var(--primary-soft);
  color: var(--text-dim);
}
.md-body blockquote p { margin: 0; color: inherit; }

.md-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 18px 0;
  font-size: 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.md-body th, .md-body td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border-soft);
}
.md-body th {
  background: var(--surface-2);
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
}
.md-body td { color: #c4cddd; }
.md-body tbody tr:last-child td { border-bottom: none; }
.md-body tbody tr:hover td { background: rgba(107, 155, 255, .04); }

.md-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 36px 0;
}

.md-body img {
  max-width: 100%;
  border-radius: 12px;
  border: 1px solid var(--border);
}

/* ================= 思维导图 ================= */
.map-wrap {
  padding: 10px 0 60px;
  overflow-x: auto;
  overflow-y: hidden;
}
#mindmap {
  position: relative;
  margin: 0 auto;
}
.mm-svg {
  position: absolute;
  left: 0;
  top: 0;
  pointer-events: none;
}
.mm-node {
  position: absolute;
  height: 32px;
  display: flex;
  align-items: center;
  padding: 0 13px;
  border-radius: 10px;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-dim);
  transition: border-color .2s, color .2s, transform .2s;
}
.mm-node:hover {
  border-color: var(--primary);
  color: var(--text);
  transform: translateX(2px);
}
.mm-root {
  background: linear-gradient(135deg, #23406f, #16264a);
  border-color: #3a62b8;
  color: #dbe7ff;
  font-weight: 700;
  font-size: 14px;
}
.mm-page {
  background: var(--surface-3);
  border-color: #2c3a52;
  color: #b8c6e0;
  font-weight: 500;
}
.mm-leaf {
  background: transparent;
  border-color: var(--border-soft);
  color: var(--text-mute);
  font-size: 12.5px;
}
.mm-leaf:hover { color: var(--primary); }

/* ================= 错误 / 加载 ================= */
.state-box {
  max-width: 560px;
  margin: 90px auto;
  padding: 28px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--surface);
  text-align: center;
}
.state-box .material-icons-outlined {
  font-size: 40px;
  color: var(--text-mute);
  margin-bottom: 12px;
}
.state-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.state-msg { font-size: 13px; color: var(--text-dim); line-height: 1.8; }
.state-msg code {
  font-family: ui-monospace, monospace;
  background: var(--surface-2);
  padding: 2px 6px;
  border-radius: 5px;
  color: #9ecbff;
  font-size: 12px;
}

.spinner {
  width: 26px;
  height: 26px;
  margin: 0 auto 14px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= 回到顶部 ================= */
.to-top {
  position: fixed;
  right: 26px;
  bottom: 26px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--text-dim);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: all .28s var(--ease);
  z-index: 80;
}
.to-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.to-top:hover { background: var(--primary-dim); color: #cfe0ff; border-color: var(--primary); }

/* ================= 遮罩 ================= */
.scrim {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .58);
  backdrop-filter: blur(2px);
  z-index: 55;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.scrim.show { opacity: 1; pointer-events: auto; }

/* ================= 响应式 ================= */
@media (max-width: 900px) {
  .icon-btn { display: flex; }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    transform: translateX(-100%);
    transition: transform .32s var(--ease);
    box-shadow: none;
  }
  .sidebar.open {
    transform: translateX(0);
    box-shadow: 0 0 70px rgba(0, 0, 0, .7);
  }

  .topbar { padding: 0 12px; gap: 8px; }
  .topbar-meta { display: none; }
  .scroller { padding: 24px 18px 140px; }
  .doc-title { font-size: 24px; }
  .md-body h2 { font-size: 18px; margin-top: 32px; }
  .md-body table { font-size: 13px; }
  .md-body th, .md-body td { padding: 8px 10px; }
  .to-top { right: 16px; bottom: 16px; }
}

@media (max-width: 480px) {
  .seg { padding: 6px 11px; font-size: 12px; }
  .seg .material-icons-outlined { display: none; }
}
</style>
</head>

<body>

<!-- ========== 侧边栏 ========== -->
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-title">
      <span class="material-icons-outlined">description</span>
      <span id="brandTitle">文档</span>
    </div>
    <div class="brand-sub" id="brandSub">加载中…</div>
    <span class="brand-ver" id="brandVer"></span>
  </div>
  <nav class="toc" id="toc"></nav>
</aside>

<div class="scrim" id="scrim"></div>

<!-- ========== 主区域 ========== -->
<main class="main">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="菜单">
      <span class="material-icons-outlined">menu</span>
    </button>

    <div class="segmented">
      <button class="seg active" data-view="doc">
        <span class="material-icons-outlined">article</span>文档
      </button>
      <button class="seg" data-view="map">
        <span class="material-icons-outlined">account_tree</span>思维导图
      </button>
    </div>

    <div class="topbar-spacer"></div>
    <div class="topbar-meta" id="topbarMeta"></div>
  </header>

  <div class="scroller" id="scroller">
    <!-- 文档视图 -->
    <div class="view active" id="docView">
      <div class="content" id="content">
        <div class="state-box">
          <div class="spinner"></div>
          <div class="state-title">正在加载文档</div>
          <div class="state-msg">读取 docs.json …</div>
        </div>
      </div>
    </div>

    <!-- 思维导图视图 -->
    <div class="view" id="mapView">
      <div class="map-wrap">
        <div id="mindmap"></div>
      </div>
    </div>
  </div>
</main>

<button class="to-top" id="toTop" aria-label="回到顶部">
  <span class="material-icons-outlined">arrow_upward</span>
</button>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  'use strict';

  var DOC_URL = 'docs.json';

  var S = {
    data: null,
    heads: {},
    anchorEls: [],
    mapById: {},
    current: null,
    mapBuilt: false
  };

  var scroller = document.getElementById('scroller');
  var toc      = document.getElementById('toc');
  var content  = document.getElementById('content');
  var sidebar  = document.getElementById('sidebar');
  var scrim    = document.getElementById('scrim');
  var toTop    = document.getElementById('toTop');

  /* ---------- 工具 ---------- */
  function make(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function md2html(md) {
    if (window.marked && typeof marked.parse === 'function') {
      try { return marked.parse(md, { gfm: true, breaks: false }); }
      catch (e) { /* fallthrough */ }
    }
    var pre = document.createElement('pre');
    pre.textContent = md;
    return pre.outerHTML;
  }

  /* ---------- 启动 ---------- */
  function boot() {
    fetch(DOC_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + r.statusText);
        return r.json();
      })
      .then(function (data) {
        S.data = data;
        render(data);
      })
      .catch(function (err) {
        renderError(err);
      });
  }

  function renderError(err) {
    content.innerHTML = '';
    var box = make('div', 'state-box');
    box.innerHTML =
      '<span class="material-icons-outlined">cloud_off</span>' +
      '<div class="state-title">文档加载失败</div>' +
      '<div class="state-msg"></div>';
    box.querySelector('.state-msg').innerHTML =
      esc(String(err && err.message || err)) +
      '<br>请确认 <code>docs.json</code> 与 <code>docs.html</code> 位于同一目录。';
    content.appendChild(box);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- 渲染 ---------- */
  function render(data) {
    if (!data || !Array.isArray(data.pages) || !data.pages.length) {
      renderError(new Error('数据格式无效：缺少 pages 数组'));
      return;
    }

    document.title = (data.title || '文档') + ' · Docs';
    document.getElementById('brandTitle').textContent = data.title || '文档';
    document.getElementById('brandSub').textContent = data.subtitle || '';
    document.getElementById('brandVer').textContent = data.version ? 'v' + data.version : '';

    var meta = document.getElementById('topbarMeta');
    meta.textContent = data.updated ? '更新于 ' + data.updated : '';

    toc.innerHTML = '';
    content.innerHTML = '';
    S.heads = {};
    S.anchorEls = [];
    S.mapById = {};
    S.mapBuilt = false;

    data.pages.forEach(function (page, idx) {
      var key = page.id || idx;
      var secId = 'sec-' + key;

      var section = make('section', 'doc-section');
      section.id = secId;

      section.appendChild(make('h1', 'doc-title', page.title || '未命名'));

      var body = make('div', 'md-body');
      body.innerHTML = md2html(page.md || '');
      section.appendChild(body);

      content.appendChild(section);

      /* 提取 h2 并分配锚点 */
      var heads = [];
      var h2s = body.querySelectorAll('h2');
      for (var i = 0; i < h2s.length; i++) {
        var id = secId + '-h' + i;
        h2s[i].id = id;
        heads.push({ id: id, text: h2s[i].textContent });
      }
      S.heads[key] = heads;

      /* 目录 */
      var group = make('div', 'toc-group');
      var link = make('a', 'toc-item', page.title || '未命名');
      link.href = '#' + secId;
      link.dataset.target = secId;
      group.appendChild(link);

      heads.forEach(function (h) {
        var sub = make('a', 'toc-sub', h.text);
        sub.href = '#' + h.id;
        sub.dataset.target = h.id;
        group.appendChild(sub);
      });

      toc.appendChild(group);
    });

    /* 建立 id -> 目录项 映射 */
    var all = toc.querySelectorAll('[data-target]');
    for (var j = 0; j < all.length; j++) {
      S.mapById[all[j].dataset.target] = all[j];
    }

    /* 收集滚动高亮锚点 */
    S.anchorEls = Array.prototype.filter.call(
      content.querySelectorAll('[id^="sec-"]'),
      function (el) { return /^(SECTION|H2)$/.test(el.tagName); }
    );

    updateActive();
  }

  /* ---------- 目录高亮 ---------- */
  function setActive(id) {
    if (S.current === id) return;
    S.current = id;

    var prev = toc.querySelectorAll('.active');
    for (var i = 0; i < prev.length; i++) prev[i].classList.remove('active');

    var link = S.mapById[id];
    if (!link) return;
    link.classList.add('active');

    var lr = link.getBoundingClientRect();
    var tr = toc.getBoundingClientRect();
    if (lr.top < tr.top + 60) {
      toc.scrollTo({ top: toc.scrollTop - (tr.top + 60 - lr.top), behavior: 'smooth' });
    } else if (lr.bottom > tr.bottom - 60) {
      toc.scrollTo({ top: toc.scrollTop + (lr.bottom - tr.bottom + 60), behavior: 'smooth' });
    }
  }

  function updateActive() {
    if (!S.anchorEls.length) return;
    var top = scroller.getBoundingClientRect().top + 130;
    var cur = S.anchorEls[0];
    for (var i = 0; i < S.anchorEls.length; i++) {
      if (S.anchorEls[i].getBoundingClientRect().top <= top) cur = S.anchorEls[i];
      else break;
    }
    if (cur) setActive(cur.id);
  }

  var ticking = false;
  scroller.addEventListener('scroll', function () {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      updateActive();
      toTop.classList.toggle('show', scroller.scrollTop > 600);
      ticking = false;
    });
  }, { passive: true });

  /* ---------- 目录点击 ---------- */
  toc.addEventListener('click', function (e) {
    var a = e.target.closest('[data-target]');
    if (!a) return;
    e.preventDefault();
    switchView('doc');
    var target = document.getElementById(a.dataset.target);
    if (!target) return;
    var top = target.getBoundingClientRect().top
            - scroller.getBoundingClientRect().top
            + scroller.scrollTop
            - 20;
    scroller.scrollTo({ top: top, behavior: 'smooth' });
    setActive(a.dataset.target);
    closeSidebar();
  });

  /* ---------- 视图切换 ---------- */
  function switchView(name) {
    var segs = document.querySelectorAll('.seg');
    for (var i = 0; i < segs.length; i++) {
      segs[i].classList.toggle('active', segs[i].dataset.view === name);
    }
    document.getElementById('docView').classList.toggle('active', name === 'doc');
    document.getElementById('mapView').classList.toggle('active', name === 'map');

    if (name === 'map') {
      buildMindmap();
      scroller.scrollTo({ top: 0, behavior: 'auto' });
    } else {
      scroller.scrollTo({ top: 0, behavior: 'auto' });
      setTimeout(updateActive, 60);
    }
  }

  var segs = document.querySelectorAll('.seg');
  for (var i = 0; i < segs.length; i++) {
    segs[i].addEventListener('click', function () {
      switchView(this.dataset.view);
    });
  }

  /* ---------- 思维导图 ---------- */
  function buildMindmap() {
    if (S.mapBuilt || !S.data) return;
    S.mapBuilt = true;

    var host = document.getElementById('mindmap');
    host.innerHTML = '';

    var LEAF_H = 34, PAGE_GAP = 20;
    var X_ROOT = 0, X_PAGE = 232, X_LEAF = 472;
    var W_ROOT = 190, W_PAGE = 200, W_LEAF = 250;
    var TOTAL_W = X_LEAF + W_LEAF + 80;

    var y = 30;
    var pages = [];

    S.data.pages.forEach(function (p, i) {
      var key = p.id || i;
      var heads = S.heads[key] || [];
      var start = y;
      var leaves = [];
      var list = heads.length ? heads : [{ text: '（无小节）' }];

      list.forEach(function (h) {
        leaves.push({ text: h.text, cy: y + LEAF_H / 2 });
        y += LEAF_H;
      });

      pages.push({
        key: key,
        title: p.title || '未命名',
        cy: (start + y) / 2,
        leaves: leaves
      });

      y += PAGE_GAP;
    });

    var H = y + 30;
    var rootCY = H / 2;

    /* --- SVG 连线 --- */
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', TOTAL_W);
    svg.setAttribute('height', H);
    svg.setAttribute('class', 'mm-svg');

    function addPath(x1, y1, x2, y2, lv) {
      var mx = (x1 + x2) / 2;
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', 'M ' + x1 + ' ' + y1 + ' C ' + mx + ' ' + y1 + ', ' + mx + ' ' + y2 + ', ' + x2 + ' ' + y2);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke-width', lv === 1 ? '1.5' : '1.2');
      p.setAttribute('stroke', lv === 1 ? 'rgba(107,155,255,.45)' : 'rgba(107,155,255,.2)');
      svg.appendChild(p);
    }

    pages.forEach(function (pg) {
      addPath(X_ROOT + W_ROOT, rootCY, X_PAGE, pg.cy, 1);
      pg.leaves.forEach(function (lf) {
        addPath(X_PAGE + W_PAGE, pg.cy, X_LEAF, lf.cy, 2);
      });
    });

    host.appendChild(svg);

    /* --- 节点 --- */
    function addNode(x, cy, w, text, cls) {
      var n = make('div', 'mm-node ' + cls, text);
      n.style.left = x + 'px';
      n.style.top = (cy - 16) + 'px';
      n.style.width = w + 'px';
      n.title = text;
      host.appendChild(n);
    }

    addNode(X_ROOT, rootCY, W_ROOT, S.data.title || '文档', 'mm-root');

    pages.forEach(function (pg) {
      addNode(X_PAGE, pg.cy, W_PAGE, pg.title, 'mm-page');
      pg.leaves.forEach(function (lf) {
        addNode(X_LEAF, lf.cy, W_LEAF, lf.text, 'mm-leaf');
      });
    });

    host.style.width = TOTAL_W + 'px';
    host.style.height = H + 'px';
  }

  /* ---------- 侧边栏抽屉 ---------- */
  function openSidebar() {
    sidebar.classList.add('open');
    scrim.classList.add('show');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    scrim.classList.remove('show');
  }

  document.getElementById('menuBtn').addEventListener('click', openSidebar);
  scrim.addEventListener('click', closeSidebar);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
  });

  /* ---------- 回到顶部 ---------- */
  toTop.addEventListener('click', function () {
    scroller.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---------- 初始化 ---------- */
  boot();
})();
</script>
</body>
</html>
